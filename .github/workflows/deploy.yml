jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build Docker image
        run: |
          docker build -t acme-app:${{ github.sha }} .
          echo "DockerHub!Pass2026" | docker login -u acme-deploy --password-stdin
