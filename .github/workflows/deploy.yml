        run: |
          curl -X POST -H 'Content-type: application/json' \
            --data '{"text":"Deployed ${{ github.sha }} to production"}' \
            https://slack-webhook.acme-corp.com/hooks/T00000000/B00000000/XXXXXXXXXXXXXXXXXXXXXXXX
